<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Camera Test</title>

 <body>
<div class="container">
  <div class="title">Upload Document 2</div>

  <!-- Camera Option -->
  <div class="card" onclick="openCamera()">
    <div class="icon">📷</div>
    <div class="text-group">
      <div class="main-text">Take Picture</div>
      <div class="sub-text">Capture using your camera</div>
    </div>
  </div>

  <!-- Library Option -->
  <div class="card" onclick="openLibrary()">
    <div class="icon">📄</div>
    <div class="text-group">
      <div class="main-text">Choose From Library</div>
      <div class="sub-text">Upload image or PDF</div>
    </div>
  </div>

  <!-- Hidden Inputs for Web Only -->
  <input 
    id="cameraInput"
    type="file"
    accept="image/*"
    capture="environment"
    onchange="handleFileChange(event)"
    style="display:none"
  />

  <input 
    id="libraryInput"
    type="file"
    accept="application/pdf,.pdf,image/jpeg,image/jpg,image/png"
    onchange="handleFileChange(event)"
    style="display:none"
  />

  <div class="preview" id="previewContainer"></div>

  <script>
    // Detect if inside React Native WebView
    const isWebView = !!window.ReactNativeWebView;

    function openCamera() {
      if (isWebView) {
        // Mobile WebView: request camera via React Native
        window.ReactNativeWebView.postMessage(
          JSON.stringify({ type: "REQUEST_CAMERA" })
        );
      } else {
        // Desktop/Web: trigger hidden input
        document.getElementById('cameraInput').click();
      }
    }

    function openLibrary() {
      if (isWebView) {
        // Mobile WebView: request file via React Native
        window.ReactNativeWebView.postMessage(
          JSON.stringify({ type: "REQUEST_FILE" })
        );
      } else {
        // Desktop/Web: trigger hidden input
        document.getElementById('libraryInput').click();
      }
    }

    // Web: Handle file selection
    function handleFileChange(event) {
      const files = event.target.files;
      const previewContainer = document.getElementById('previewContainer');
      previewContainer.innerHTML = "";

      Array.from(files).forEach(file => {
        const div = document.createElement("div");
        div.textContent = `Selected: ${file.name}`;
        previewContainer.appendChild(div);
      });
    }

    // Mobile WebView: Listen for response from React Native
    window.addEventListener("message", function (event) {
      const { type, payload } = event.data || {};

      if (type === "CAMERA_RESULT") {
        if (payload) {
          alert("Camera Granted (WebView) — handle native capture now");
          // You can trigger file capture on native side here
        } else {
          alert("Camera Denied (WebView)");
        }
      }

      if (type === "FILE_RESULT") {
        if (payload) {
          alert("File Access Granted (WebView) — handle native picker now");
          // You can open native file picker here
        } else {
          alert("File Access Denied (WebView)");
        }
      }
    });
  </script>
</div>
   

</body>
</html>
