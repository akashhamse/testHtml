<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Camera Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f5f5f5;
    }

    .container {
      max-width: 400px;
      margin: auto;
    }

    .title {
      font-size: 22px;
      margin-bottom: 20px;
      font-weight: 300;
    }

    .card {
      background: white;
      padding: 16px;
      border-radius: 10px;
      margin-bottom: 12px;
      cursor: pointer;
      display: flex;
      gap: 12px;
      align-items: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .card:hover {
      background: #f0f0f0;
    }

    .icon {
      font-size: 24px;
    }

    .text-group {
      display: flex;
      flex-direction: column;
    }

    .main-text {
      font-weight: bold;
      font-size: 14px;
    }

    .sub-text {
      font-size: 12px;
      color: gray;
    }

    .preview {
      margin-top: 20px;
    }

    img {
      width: 100%;
      border-radius: 8px;
    }

    input[type="file"] {
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="title">Upload Document</div>

    <!-- Camera Option -->
    <div class="card" onclick="openCamera()">
      <div class="icon">📷</div>
      <div class="text-group">
        <div class="main-text">Take Picture</div>
        <div class="sub-text">Capture using your camera</div>
      </div>
    </div>

    <!-- Library Option -->
    <div class="card" onclick="openLibrary()">
      <div class="icon">📄</div>
      <div class="text-group">
        <div class="main-text">Choose From Library</div>
        <div class="sub-text">Upload image or PDF</div>
      </div>
    </div>

    <!-- Hidden Inputs -->
    <input 
      id="cameraInput"
      type="file"
      accept="image/*"
      capture="environment"
      onchange="handleFileChange(event)"
    />

    <input 
      id="libraryInput"
      type="file"
      accept="application/pdf,.pdf,image/jpeg,image/jpg,image/png"
      onchange="handleFileChange(event)"
    />

    <div class="preview" id="previewContainer"></div>
  </div>

  <script>
    function openCamera() {
      document.getElementById("cameraInput").click();
    }

    function openLibrary() {
      document.getElementById("libraryInput").click();
    }

    function handleFileChange(event) {
      const file = event.target.files[0];
      if (!file) return;

      console.log("Selected file:", file);

      const previewContainer = document.getElementById("previewContainer");
      previewContainer.innerHTML = "";

      if (file.type.startsWith("image/")) {
        const img = document.createElement("img");
        img.src = URL.createObjectURL(file);
        previewContainer.appendChild(img);
      } else {
        previewContainer.innerHTML = "<p>File selected: " + file.name + "</p>";
      }

      // Reset input so same file can be selected again
      event.target.value = "";
    }
  </script>

</body>
</html>
